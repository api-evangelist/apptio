naftiko: 1.0.0-alpha2
info:
  label: Apptio Technology Business Management API — Budgets
  description: 'Apptio Technology Business Management API — Budgets. 1 operations. Lead operation: Apptio - List Budgets.
    Self-contained Naftiko capability covering one Apptio business surface.'
  tags:
  - Apptio
  - Budgets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPTIO_API_KEY: APPTIO_API_KEY
capability:
  consumes:
  - type: http
    namespace: apptio-budgets
    baseUri: https://api.apptio.com/v1
    description: Apptio Technology Business Management API — Budgets business capability. Self-contained, no shared references.
    resources:
    - name: budgets
      path: /budgets
      operations:
      - name: listbudgets
        method: GET
        description: Apptio - List Budgets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fiscalYear
          in: query
          type: integer
          description: Filter by fiscal year
    authentication:
      type: bearer
      token: '{{env.APPTIO_API_KEY}}'
  exposes:
  - type: rest
    namespace: apptio-budgets-rest
    port: 8080
    description: REST adapter for Apptio Technology Business Management API — Budgets. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/budgets
      name: budgets
      description: REST surface for budgets.
      operations:
      - method: GET
        name: listbudgets
        description: Apptio - List Budgets
        call: apptio-budgets.listbudgets
        with:
          fiscalYear: rest.fiscalYear
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apptio-budgets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apptio Technology Business Management API — Budgets. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: apptio-list-budgets
      description: Apptio - List Budgets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apptio-budgets.listbudgets
      with:
        fiscalYear: tools.fiscalYear
      outputParameters:
      - type: object
        mapping: $.
