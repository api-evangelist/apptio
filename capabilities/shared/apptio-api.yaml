naftiko: "1.0.0-alpha1"

info:
  label: Apptio API
  description: >-
    API for the Apptio technology business management platform, providing access
    to cost allocations, IT budgets, and financial reporting for IT organizations.
  tags:
    - Apptio
    - Technology Business Management
    - IT Finance
    - Cost Management
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      APPTIO_API_TOKEN: APPTIO_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: apptio
      baseUri: "https://api.apptio.com/v1"
      description: Apptio TBM API
      authentication:
        type: bearer
        token: "{{APPTIO_API_TOKEN}}"
      resources:
        - name: cost-allocations
          path: /cost-allocations
          description: Technology cost allocation records
          operations:
            - name: list-cost-allocations
              method: GET
              description: Returns cost allocation records
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-cost-allocation
              method: GET
              description: Returns a specific cost allocation
              inputParameters:
                - name: allocationId
                  in: path
                  type: string
                  required: true
                  description: Allocation identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: budgets
          path: /budgets
          description: IT budget management
          operations:
            - name: list-budgets
              method: GET
              description: Returns IT budgets
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: reports
          path: /reports
          description: Financial reports
          operations:
            - name: list-reports
              method: GET
              description: Returns available financial reports
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: mcp
      port: 9090
      namespace: apptio-mcp
      transport: http
      tools:
        - name: list-cost-allocations
          description: Lists technology cost allocations by cost center and period
          hints:
            readOnly: true
            idempotent: true
          call: "apptio.list-cost-allocations"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-cost-allocation
          description: Gets details for a specific technology cost allocation record
          hints:
            readOnly: true
            idempotent: true
          call: "apptio.get-cost-allocation"
          with:
            allocationId: "tools.allocationId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-it-budgets
          description: Lists IT budget plans and their current spending status
          hints:
            readOnly: true
            idempotent: true
          call: "apptio.list-budgets"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-financial-reports
          description: Lists available technology business management financial reports
          hints:
            readOnly: true
            idempotent: true
          call: "apptio.list-reports"
          outputParameters:
            - type: object
              mapping: "$."
